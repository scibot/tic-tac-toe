<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ground:    #131B2E;
      --surface:   #1A2438;
      --surface-2: #212D47;
      --text:      #E8E0CC;
      --text-dim:  rgba(232,224,204,0.35);
      --grid:      rgba(232,224,204,0.14);
      --x:         #E8614A;
      --o:         #5BBDE4;
      --x-bg:      rgba(232,97,74,0.10);
      --o-bg:      rgba(91,189,228,0.10);
    }

    body {
      background: var(--ground);
      color: var(--text);
      font-family: 'Space Grotesk', system-ui, sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .wrap {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* ── Title ─────────────────────────────────────── */
    .title {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ── Scoreboard ─────────────────────────────────── */
    .scores {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 0.75rem;
      background: var(--surface);
      border-radius: 10px;
      padding: 1rem 1.25rem;
    }

    .score-side {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }
    .score-side.left  { align-items: flex-start; }
    .score-side.right { align-items: flex-end; }

    .score-label {
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .score-side.left  .score-label { color: var(--x); }
    .score-side.right .score-label { color: var(--o); }

    .score-name {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-weight: 400;
    }

    .score-num {
      font-size: 2.75rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text);
    }

    .score-mid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
    }
    .score-mid-num {
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1;
      color: var(--text-dim);
    }
    .score-mid-label {
      font-size: 0.58rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    /* ── Status ──────────────────────────────────────── */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .status-text {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      transition: color 0.2s;
    }

    .turn-pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
      transition: background 0.2s, box-shadow 0.2s;
    }
    .turn-pip.x { background: var(--x); box-shadow: 0 0 8px var(--x); }
    .turn-pip.o { background: var(--o); box-shadow: 0 0 8px var(--o); }
    .turn-pip.none { background: transparent; box-shadow: none; }

    /* ── Board ───────────────────────────────────────── */
    .board {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 3px;
      background: var(--grid);
      border: 3px solid var(--grid);
      border-radius: 8px;
      overflow: hidden;
      aspect-ratio: 1;
      width: 100%;
    }

    .cell {
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }

    .cell:hover:not(.taken):not(.locked) {
      background: rgba(232,224,204,0.04);
    }
    .cell.taken,
    .cell.locked { cursor: default; }

    .cell.win { }
    .cell.win-x { background: var(--x-bg); }
    .cell.win-o { background: var(--o-bg); }

    /* hover ghost mark */
    .cell:not(.taken):not(.locked)::after {
      content: '';
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }

    /* ── SVG marks ───────────────────────────────────── */
    .mark {
      width: 58%;
      height: 58%;
      display: block;
      overflow: visible;
    }

    .x-arm {
      stroke: var(--x);
      stroke-width: 9;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 88;
      stroke-dashoffset: 88;
    }
    .x-arm:nth-child(1) { animation: draw-stroke 0.22s cubic-bezier(.4,0,.2,1) forwards; }
    .x-arm:nth-child(2) { animation: draw-stroke 0.22s cubic-bezier(.4,0,.2,1) 0.17s forwards; }

    .o-ring {
      stroke: var(--o);
      stroke-width: 9;
      stroke-linecap: round;
      fill: none;
      stroke-dasharray: 204;
      stroke-dashoffset: 204;
      animation: draw-stroke 0.38s cubic-bezier(.4,0,.2,1) forwards;
    }

    @keyframes draw-stroke {
      to { stroke-dashoffset: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      .x-arm, .o-ring {
        animation: none;
        stroke-dashoffset: 0;
      }
    }

    /* ── Controls ────────────────────────────────────── */
    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      align-items: stretch;
    }

    .btn-new {
      padding: 0.85rem 1.5rem;
      background: transparent;
      border: 1.5px solid rgba(232,224,204,0.22);
      border-radius: 8px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .btn-new:hover {
      border-color: rgba(232,224,204,0.45);
      background: rgba(232,224,204,0.04);
    }
    .btn-new:focus-visible { outline: 2px solid var(--o); outline-offset: 3px; }

    .pill-group {
      display: flex;
      background: var(--surface);
      border-radius: 8px;
      padding: 3px;
      gap: 2px;
    }

    .pill-btn {
      flex: 1;
      padding: 0.45rem 0.75rem;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-dim);
      font-family: inherit;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .pill-btn:hover { color: var(--text); }
    .pill-btn.active {
      background: var(--surface-2);
      color: var(--text);
    }
    .pill-btn:focus-visible { outline: 2px solid var(--o); outline-offset: 2px; }

    .diff-row { display: flex; }
    .diff-row.hidden { display: none; }

    /* ── Next-starts indicator ───────────────────────── */
    .next-label {
      text-align: center;
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="title">Tic &nbsp;·&nbsp; Tac &nbsp;·&nbsp; Toe</p>

    <div class="scores" role="region" aria-label="Scores">
      <div class="score-side left">
        <span class="score-label">X</span>
        <span class="score-num" id="score-x">0</span>
        <span class="score-name" id="name-x">Player 1</span>
      </div>
      <div class="score-mid">
        <span class="score-mid-num" id="score-d">0</span>
        <span class="score-mid-label">Draws</span>
      </div>
      <div class="score-side right">
        <span class="score-label">O</span>
        <span class="score-num" id="score-o">0</span>
        <span class="score-name" id="name-o">Player 2</span>
      </div>
    </div>

    <div class="status-bar" aria-live="polite">
      <div class="turn-pip none" id="pip"></div>
      <span class="status-text" id="status">X goes first</span>
    </div>

    <div class="board" id="board" role="grid" aria-label="Game board"></div>

    <div class="controls">
      <button class="btn-new" id="btn-new">New Game</button>

      <div class="pill-group" role="group" aria-label="Game mode">
        <button class="pill-btn active" data-mode="pvp">Player vs Player</button>
        <button class="pill-btn" data-mode="pvc">vs Computer</button>
      </div>

      <div class="pill-group diff-row hidden" id="diff-row" role="group" aria-label="Difficulty">
        <button class="pill-btn" data-diff="easy">Easy</button>
        <button class="pill-btn active" data-diff="medium">Medium</button>
        <button class="pill-btn" data-diff="hard">Hard</button>
      </div>

      <p class="next-label" id="next-label"></p>
    </div>
  </div>

<script>
  // ── State ───────────────────────────────────────────────
  let board        = Array(9).fill(null);
  let current      = 'X';          // whose turn
  let nextStart    = 'X';          // who starts next game (flips after each)
  let gameActive   = true;
  let mode         = 'pvp';        // 'pvp' | 'pvc'
  let difficulty   = 'medium';     // 'easy' | 'medium' | 'hard'
  let scores       = { X:0, O:0, D:0 };
  let aiThinking   = false;

  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  // ── DOM refs ─────────────────────────────────────────────
  const boardEl    = document.getElementById('board');
  const statusEl   = document.getElementById('status');
  const pipEl      = document.getElementById('pip');
  const scoreX     = document.getElementById('score-x');
  const scoreO     = document.getElementById('score-o');
  const scoreD     = document.getElementById('score-d');
  const nameX      = document.getElementById('name-x');
  const nameO      = document.getElementById('name-o');
  const nextLabel  = document.getElementById('next-label');
  const diffRow    = document.getElementById('diff-row');

  // ── Init board cells ────────────────────────────────────
  for (let i = 0; i < 9; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.setAttribute('role', 'gridcell');
    cell.setAttribute('aria-label', `Cell ${i+1}`);
    cell.dataset.idx = i;
    cell.addEventListener('click', onCellClick);
    boardEl.appendChild(cell);
  }

  function cells() { return boardEl.querySelectorAll('.cell'); }

  // ── Render ───────────────────────────────────────────────
  function renderBoard(winLine) {
    cells().forEach((cell, i) => {
      cell.innerHTML = '';
      cell.className = 'cell';
      if (board[i]) {
        cell.classList.add('taken');
        cell.appendChild(makeMark(board[i]));
        cell.setAttribute('aria-label', `Cell ${i+1}: ${board[i]}`);
      } else {
        cell.setAttribute('aria-label', `Cell ${i+1}: empty`);
      }
      if (!gameActive) cell.classList.add('locked');
    });
    if (winLine) {
      winLine.forEach(i => {
        cells()[i].classList.add('win', board[i] === 'X' ? 'win-x' : 'win-o');
      });
    }
  }

  function makeMark(player) {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('aria-hidden', 'true');
    svg.classList.add('mark');

    if (player === 'X') {
      const l1 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l1.setAttribute('x1','18'); l1.setAttribute('y1','18');
      l1.setAttribute('x2','82'); l1.setAttribute('y2','82');
      l1.classList.add('x-arm');

      const l2 = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      l2.setAttribute('x1','82'); l2.setAttribute('y1','18');
      l2.setAttribute('x2','18'); l2.setAttribute('y2','82');
      l2.classList.add('x-arm');

      svg.appendChild(l1);
      svg.appendChild(l2);
    } else {
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx','50'); c.setAttribute('cy','50'); c.setAttribute('r','32');
      c.classList.add('o-ring');
      svg.appendChild(c);
    }
    return svg;
  }

  function renderStatus(result) {
    if (!result) {
      const whose = (mode === 'pvc' && current === 'O') ? 'Computer' : `${current}`;
      statusEl.textContent = `${whose}'s turn`;
      pipEl.className = `turn-pip ${current.toLowerCase()}`;
    } else if (result.winner === 'draw') {
      statusEl.textContent = 'Draw — well played';
      pipEl.className = 'turn-pip none';
    } else {
      const who = (mode === 'pvc' && result.winner === 'O') ? 'Computer wins' :
                  (mode === 'pvc' && result.winner === 'X') ? 'You win' :
                  `${result.winner} wins`;
      statusEl.textContent = who;
      pipEl.className = `turn-pip ${result.winner.toLowerCase()}`;
    }
  }

  function renderNextLabel() {
    if (gameActive) {
      nextLabel.textContent = '';
    } else {
      const n = nextStart;
      const who = (mode === 'pvc' && n === 'O') ? 'Computer' :
                  (mode === 'pvc' && n === 'X') ? 'You' : n;
      nextLabel.textContent = `${who} starts next game`;
    }
  }

  function renderNames() {
    if (mode === 'pvp') {
      nameX.textContent = 'Player 1';
      nameO.textContent = 'Player 2';
    } else {
      nameX.textContent = nextStart === 'X' ? 'You' : 'Computer';
      nameO.textContent = nextStart === 'O' ? 'You' : 'Computer';
    }
  }

  // ── Game logic ───────────────────────────────────────────
  function checkResult(b) {
    for (const [a,c,d] of WINS) {
      if (b[a] && b[a] === b[c] && b[a] === b[d])
        return { winner: b[a], line: [a,c,d] };
    }
    if (b.every(Boolean)) return { winner: 'draw', line: null };
    return null;
  }

  function onCellClick(e) {
    const idx = +e.currentTarget.dataset.idx;
    if (!gameActive || board[idx] || aiThinking) return;
    if (mode === 'pvc' && current === 'O') return;
    playMove(idx);
  }

  function playMove(idx) {
    board[idx] = current;
    const result = checkResult(board);
    renderBoard(result ? result.line : null);

    if (result) {
      gameActive = false;
      if (result.winner === 'draw') scores.D++;
      else scores[result.winner]++;
      updateScores();
      renderStatus(result);
      renderNextLabel();
      return;
    }

    current = current === 'X' ? 'O' : 'X';
    renderStatus(null);

    if (mode === 'pvc' && current === 'O' && gameActive) {
      aiThinking = true;
      setTimeout(() => { aiMove(); aiThinking = false; }, 350);
    }
  }

  function aiMove() {
    if (!gameActive) return;
    const avail = board.map((v,i) => v === null ? i : null).filter(v => v !== null);
    if (!avail.length) return;

    let idx;
    if (difficulty === 'easy') {
      idx = avail[Math.floor(Math.random() * avail.length)];
    } else if (difficulty === 'medium') {
      idx = mediumMove(avail);
    } else {
      idx = hardMove();
    }
    playMove(idx);
  }

  function mediumMove(avail) {
    // Win if possible
    for (const i of avail) {
      board[i] = 'O';
      if (checkResult(board)) { board[i] = null; return i; }
      board[i] = null;
    }
    // Block opponent win
    for (const i of avail) {
      board[i] = 'X';
      if (checkResult(board)) { board[i] = null; return i; }
      board[i] = null;
    }
    // Take center
    if (avail.includes(4)) return 4;
    // Take corner
    const corners = avail.filter(i => [0,2,6,8].includes(i));
    if (corners.length) return corners[Math.floor(Math.random() * corners.length)];
    // Random
    return avail[Math.floor(Math.random() * avail.length)];
  }

  function hardMove() {
    const avail = board.map((v,i) => v === null ? i : null).filter(v => v !== null);
    let best = -Infinity, move = avail[0];
    for (const i of avail) {
      board[i] = 'O';
      const score = minimax(board, false, -Infinity, Infinity, 0);
      board[i] = null;
      if (score > best) { best = score; move = i; }
    }
    return move;
  }

  function minimax(b, isMax, alpha, beta, depth) {
    const r = checkResult(b);
    if (r) {
      if (r.winner === 'O') return 10 - depth;
      if (r.winner === 'X') return depth - 10;
      return 0;
    }
    const avail = b.map((v,i) => v === null ? i : null).filter(v => v !== null);
    if (isMax) {
      let best = -Infinity;
      for (const i of avail) {
        b[i] = 'O';
        best = Math.max(best, minimax(b, false, alpha, beta, depth + 1));
        b[i] = null;
        alpha = Math.max(alpha, best);
        if (beta <= alpha) break;
      }
      return best;
    } else {
      let best = Infinity;
      for (const i of avail) {
        b[i] = 'X';
        best = Math.min(best, minimax(b, true, alpha, beta, depth + 1));
        b[i] = null;
        beta = Math.min(beta, best);
        if (beta <= alpha) break;
      }
      return best;
    }
  }

  function updateScores() {
    scoreX.textContent = scores.X;
    scoreO.textContent = scores.O;
    scoreD.textContent = scores.D;
  }

  function newGame() {
    board       = Array(9).fill(null);
    current     = nextStart;
    nextStart   = nextStart === 'X' ? 'O' : 'X';
    gameActive  = true;
    aiThinking  = false;
    renderBoard(null);
    renderStatus(null);
    renderNextLabel();
    renderNames();

    // If PvC and computer goes first (current === 'O'), trigger AI
    if (mode === 'pvc' && current === 'O') {
      aiThinking = true;
      setTimeout(() => { aiMove(); aiThinking = false; }, 600);
    }
  }

  // ── UI controls ──────────────────────────────────────────
  document.getElementById('btn-new').addEventListener('click', newGame);

  document.querySelectorAll('[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      mode = btn.dataset.mode;
      document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('active', b === btn));
      diffRow.classList.toggle('hidden', mode !== 'pvc');
      nextStart = 'X';
      newGame();
    });
  });

  document.querySelectorAll('[data-diff]').forEach(btn => {
    btn.addEventListener('click', () => {
      difficulty = btn.dataset.diff;
      document.querySelectorAll('[data-diff]').forEach(b => b.classList.toggle('active', b === btn));
      nextStart = 'X';
      newGame();
    });
  });

  // ── Boot ─────────────────────────────────────────────────
  newGame();
</script>
</body>
</html>
